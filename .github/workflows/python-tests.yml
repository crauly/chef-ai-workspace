name: Python core tests
# CI is intentionally manual to preserve GitHub Actions minutes.
# Run locally before explicitly dispatching this workflow.
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: pip install -r requirements-api.txt
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: test-only-postgres-password
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema and verify price adoption and recipe guards
        shell: bash
        run: |
          set -euo pipefail
          createdb chef_procurement_test
          export PGDATABASE=chef_procurement_test
          psql -v ON_ERROR_STOP=1 -f tests/sql/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            if [[ "$migration" == *20261104090755_approved_recipe_procurement.sql ]]; then
              psql -v ON_ERROR_STOP=1 -f tests/sql/procurement_legacy_before.sql
            fi
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f tests/sql/offer_quantity_identity.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/procurement_legacy_after.sql
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-api.txt
      - name: Approved procurement API and real PostgreSQL regression
        env:
          CHEF_TEST_PGHOST: localhost
          CHEF_TEST_PGPORT: '5432'
        run: |
          python -m unittest discover -s tests -p 'test_procurement_postgres.py' -v
          python -m unittest discover -s tests -p 'test_ingredient_edit_postgres.py' -v
          python -m unittest discover -s tests -p 'test_scheduled_research_postgres.py' -v
